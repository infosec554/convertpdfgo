name: Release

# Triggers on:
#   1. Pushing a tag that looks like v1.2.3 → builds + pushes versioned images
#   2. Manual dispatch with a tag input → useful for hotfixes
#
# Images go to GitHub Container Registry (GHCR), free for public/private.
# To use Docker Hub instead: change `registry` and add DOCKERHUB_USERNAME /
# DOCKERHUB_TOKEN secrets.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v1.2.3)"
        required: true

permissions:
  contents: read
  packages: write   # required to push to ghcr.io

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}

jobs:
  # ──────────────────────────────────────────────────────────────────────
  # Re-run all CI gates before a release goes out. We don't `needs:` the
  # CI workflow because GitHub doesn't compose workflows; cheaper to run
  # the same checks here than to gamble on stale results.
  # ──────────────────────────────────────────────────────────────────────
  verify:
    name: verify (test + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true

      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - run: CGO_ENABLED=0 go build -o /tmp/api ./cmd
      - run: CGO_ENABLED=0 go build -o /tmp/worker ./cmd/worker
      - run: CGO_ENABLED=0 go build -o /tmp/admin-bootstrap ./cmd/admin-bootstrap

  # ──────────────────────────────────────────────────────────────────────
  # Build api + worker images and push them to GHCR with two tags:
  #   - the version (v1.2.3)
  #   - latest (only on push events; manual dispatch keeps an explicit tag)
  # ──────────────────────────────────────────────────────────────────────
  release:
    name: build & push images
    runs-on: ubuntu-latest
    needs: verify
    strategy:
      matrix:
        target: [api, worker]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/convertpdfgo-${{ matrix.target }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ github.event.inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: build & push
        uses: docker/build-push-action@v5
        with:
          context: .
          build-args: TARGET=${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

  # ──────────────────────────────────────────────────────────────────────
  # Cut a GitHub Release with auto-generated notes (commits since the
  # previous tag). Only runs on real tag pushes, not manual dispatch.
  # ──────────────────────────────────────────────────────────────────────
  github-release:
    name: github release notes
    runs-on: ubuntu-latest
    needs: release
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            Container images:
            - `ghcr.io/${{ github.repository_owner }}/convertpdfgo-api:${{ github.ref_name }}`
            - `ghcr.io/${{ github.repository_owner }}/convertpdfgo-worker:${{ github.ref_name }}`
