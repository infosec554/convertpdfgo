version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: my_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: authservice
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Wrapper forces the postgres role's password to match POSTGRES_PASSWORD
      # on every boot. The stock image only honours the env on FIRST init,
      # so any later drift between env and on-disk password meant the api
      # silently couldn't authenticate. WEAKNESSES.md #3 has the full story.
      - ./deploy/postgres/sync-password.sh:/usr/local/bin/sync-password.sh:ro
    entrypoint: ["bash", "/usr/local/bin/sync-password.sh"]
    command: ["postgres"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: my_redis
    restart: always
    command: redis-server --requirepass 1234
    environment:
      REDIS_PASSWORD: 1234
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "1234", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  gotenberg:
    image: gotenberg/gotenberg:7
    container_name: gotenberg
    restart: always
    ports:
      - "3000:3000"
    command:
      - gotenberg
      - --libreoffice-disable-routes=false

  asynqmon:
    image: hibiken/asynqmon:latest
    container_name: asynqmon
    restart: always
    ports:
      - "8081:8080"
    command:
      - "--redis-addr=redis:6379"
      - "--redis-password=1234"
    depends_on:
      - redis

  prometheus:
    image: prom/prometheus:latest
    container_name: convertpdfgo_prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # Rules are loaded via `rule_files: - alerts.yml` in prometheus.yml.
      # Mount alongside so the relative path resolves inside /etc/prometheus.
      - ./deploy/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    profiles: ["full", "monitoring"]

  grafana:
    image: grafana/grafana:latest
    container_name: convertpdfgo_grafana
    restart: always
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    profiles: ["full", "monitoring"]

  api:
    # IMAGE override takes priority: set API_IMAGE=ghcr.io/.../convertpdfgo-api:sha-abc1234
    # to pin a specific build (rollback or CI deploy). If unset, falls back
    # to a local rebuild (`docker compose up --build`) — useful for dev.
    image: ${API_IMAGE:-convertpdfgo-api}
    build:
      context: .
      args:
        TARGET: api
    container_name: convertpdfgo_api
    restart: unless-stopped
    ports:
      - "8080:8080"
    # OAuth/JWT/Brevo/cloud-export secrets come from .env (gitignored).
    # The inline `environment:` keys below override .env for infra
    # plumbing — postgres/redis hostnames are docker-network names and
    # must NOT leak out of the compose file.
    env_file:
      - .env
    environment:
      # Only the API runs migrations. Worker shares the DB but must NOT
      # call migrate.Up() — otherwise both racing on schema_migrations
      # leaves it dirty (we hit this on the very first deploy).
      RUN_MIGRATIONS: "true"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: authservice
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: 1234
      GOTENBERG_URL: http://gotenberg:3000
    volumes:
      - app_storage:/app/storage
      - app_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      gotenberg:
        condition: service_started
    profiles: ["full"]

  worker:
    image: ${WORKER_IMAGE:-convertpdfgo-worker}
    build:
      context: .
      args:
        TARGET: worker
    container_name: convertpdfgo_worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: authservice
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: 1234
      GOTENBERG_URL: http://gotenberg:3000
    volumes:
      - app_storage:/app/storage
      - app_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      gotenberg:
        condition: service_started
    profiles: ["full"]

  web:
    # Next.js frontend (apps/web from BahromWeb/converto).
    # Source lives at /root/converto on the host — kept up to date by
    # the frontend repo's GitHub Action, which fast-forwards on every
    # push to main and asks docker-compose to rebuild this service.
    # `output: "standalone"` in next.config.mjs means the runtime image
    # is ~150 MB instead of an 800 MB pnpm-managed monorepo.
    image: converto-web
    container_name: convertpdfgo_web
    restart: unless-stopped
    build:
      context: /root/converto
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: "3000"
      # Frontend reads tokens out of the OAuth callback URL hash/query
      # and talks to the API at the same hostname; APIs and the SPA share
      # convertpdfgo.com under Caddy's path routing.
      NEXT_PUBLIC_API_URL: https://convertpdfgo.com
      NEXT_PUBLIC_SITE_URL: https://convertpdfgo.com
    profiles: ["full"]

  caddy:
    # Edge: reverse-proxy + automatic Let's Encrypt SSL for convertpdfgo.com
    # and www. DNS must point at this host before Caddy can complete the
    # HTTP-01 ACME challenge.
    image: caddy:2-alpine
    container_name: convertpdfgo_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - web
    profiles: ["full"]

volumes:
  postgres_data:
  redis_data:
  app_storage:
  app_uploads:
  caddy_data:
  caddy_config:
  prometheus_data:
  grafana_data:
