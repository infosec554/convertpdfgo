# All service-to-service traffic stays on the docker bridge network.
# Only Caddy publishes ports to the host — everything else (postgres,
# redis, gotenberg, api, worker, asynqmon, prometheus, grafana, web)
# is reachable from inside the compose stack only. This used to leak:
# docker-proxy on 0.0.0.0:5433 / 6380 / 8081 / 9090 / 3000 / 3001 /
# 8080 bypassed the host UFW rules (the well-known Docker+UFW issue)
# and let scanners brute-force the weak postgres/redis passwords. The
# rest of this file's hardening (env_file-driven creds, no inline
# `ports:` outside caddy) follows from that lesson — every credential
# now comes from .env, the file the host never commits to git.

services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: my_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: authservice
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Wrapper forces the postgres role's password to match POSTGRES_PASSWORD
      # on every boot. The stock image only honours the env on FIRST init,
      # so any later drift between env and on-disk password meant the api
      # silently couldn't authenticate. WEAKNESSES.md #3 has the full story.
      - ./deploy/postgres/sync-password.sh:/usr/local/bin/sync-password.sh:ro
    entrypoint: ["bash", "/usr/local/bin/sync-password.sh"]
    command: ["postgres"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: my_redis
    restart: always
    # --requirepass via the entrypoint is the only way redis 7 honours a
    # password on boot — env vars don't bind it. The healthcheck needs
    # the same secret, so both come from one source ($REDIS_PASSWORD).
    command: ["sh", "-c", "redis-server --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 5

  gotenberg:
    image: gotenberg/gotenberg:7
    container_name: gotenberg
    restart: always
    expose:
      - "3000"
    # LibreOffice can take >30s on complex docx/xlsx/pptx — the default
    # 30s api-timeout was killing Excel→PDF / PPT→PDF conversions mid-run.
    # 180s covers the long tail without letting a stuck worker hold a
    # connection forever.
    command:
      - gotenberg
      - --libreoffice-disable-routes=false
      - --api-timeout=180s
    deploy:
      resources:
        limits:
          cpus: "2.0"

  asynqmon:
    image: hibiken/asynqmon:latest
    container_name: asynqmon
    restart: always
    # Asynqmon has no auth of its own — keeping it off the host port
    # plus inside the docker network is the access control.
    expose:
      - "8080"
    command:
      - "--redis-addr=redis:6379"
      - "--redis-password=${REDIS_PASSWORD}"
    depends_on:
      - redis

  prometheus:
    image: prom/prometheus:latest
    container_name: convertpdfgo_prometheus
    restart: always
    expose:
      - "9090"
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # Rules are loaded via `rule_files: - alerts.yml` in prometheus.yml.
      # Mount alongside so the relative path resolves inside /etc/prometheus.
      - ./deploy/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    profiles: ["full", "monitoring"]

  grafana:
    image: grafana/grafana:latest
    container_name: convertpdfgo_grafana
    restart: always
    expose:
      - "3000"
    environment:
      # admin password sourced from .env so the default `admin/admin` is
      # never burned into git history again.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-changeme}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    profiles: ["full", "monitoring"]

  api:
    # IMAGE override takes priority: set API_IMAGE=ghcr.io/.../convertpdfgo-api:sha-abc1234
    # to pin a specific build (rollback or CI deploy). If unset, falls back
    # to a local rebuild (`docker compose up --build`) — useful for dev.
    image: ${API_IMAGE:-convertpdfgo-api}
    build:
      context: .
      args:
        TARGET: api
    container_name: convertpdfgo_api
    restart: unless-stopped
    expose:
      - "8080"
    # OAuth/JWT/Brevo/cloud-export secrets come from .env (gitignored).
    # The inline `environment:` keys below override .env for infra
    # plumbing — postgres/redis hostnames are docker-network names and
    # must NOT leak out of the compose file.
    env_file:
      - .env
    environment:
      # Only the API runs migrations. Worker shares the DB but must NOT
      # call migrate.Up() — otherwise both racing on schema_migrations
      # leaves it dirty (we hit this on the very first deploy).
      RUN_MIGRATIONS: "true"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: postgres
      POSTGRES_DB: authservice
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      GOTENBERG_URL: http://gotenberg:3000
    volumes:
      - app_storage:/app/storage
      - app_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      gotenberg:
        condition: service_started
    profiles: ["full"]

  worker:
    image: ${WORKER_IMAGE:-convertpdfgo-worker}
    build:
      context: .
      args:
        TARGET: worker
    container_name: convertpdfgo_worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: postgres
      POSTGRES_DB: authservice
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      GOTENBERG_URL: http://gotenberg:3000
    volumes:
      - app_storage:/app/storage
      - app_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      gotenberg:
        condition: service_started
    profiles: ["full"]

  web:
    # Next.js frontend (apps/web from BahromWeb/converto).
    # Source lives at /root/converto on the host — kept up to date by
    # the frontend repo's GitHub Action, which fast-forwards on every
    # push to main and asks docker-compose to rebuild this service.
    # `output: "standalone"` in next.config.mjs means the runtime image
    # is ~150 MB instead of an 800 MB pnpm-managed monorepo.
    image: converto-web
    container_name: convertpdfgo_web
    restart: unless-stopped
    build:
      context: /root/converto
      dockerfile: Dockerfile
      # NEXT_PUBLIC_* are inlined into the client bundle at build time,
      # so they have to be build args. The `environment:` block below
      # only reaches the server-side route handlers — it cannot change
      # what the browser bundle was compiled with.
      args:
        NEXT_PUBLIC_API_URL: https://convertpdfgo.com
        NEXT_PUBLIC_SITE_URL: https://convertpdfgo.com
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      # Frontend reads tokens out of the OAuth callback URL hash/query
      # and talks to the API at the same hostname; APIs and the SPA share
      # convertpdfgo.com under Caddy's path routing.
      NEXT_PUBLIC_API_URL: https://convertpdfgo.com
      NEXT_PUBLIC_SITE_URL: https://convertpdfgo.com
    profiles: ["full"]

  admin:
    # Operations console (apps/admin from the same frontend repo).
    # Built from Dockerfile.admin in that repo — same standalone Next
    # runtime as `web`, served on 3001 and routed by Caddy under its own
    # hostname rather than a path, so admin cookies never share a scope
    # with the public site.
    image: converto-admin
    container_name: convertpdfgo_admin
    restart: unless-stopped
    build:
      context: /root/converto
      dockerfile: Dockerfile.admin
      args:
        NEXT_PUBLIC_ADMIN_URL: https://admin.convertpdfgo.com
        NEXT_PUBLIC_SITE_URL: https://convertpdfgo.com
    expose:
      - "3001"
    environment:
      NODE_ENV: production
      PORT: "3001"
      NEXT_PUBLIC_ADMIN_URL: https://admin.convertpdfgo.com
      NEXT_PUBLIC_SITE_URL: https://convertpdfgo.com
    profiles: ["full"]

  caddy:
    # Edge: reverse-proxy + automatic Let's Encrypt SSL for convertpdfgo.com
    # and www. DNS must point at this host before Caddy can complete the
    # HTTP-01 ACME challenge. The ONLY service in this file that publishes
    # to the host — every other port lives on the docker bridge.
    image: caddy:2-alpine
    container_name: convertpdfgo_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - web
      - admin
    profiles: ["full"]

volumes:
  postgres_data:
  redis_data:
  app_storage:
  app_uploads:
  caddy_data:
  caddy_config:
  prometheus_data:
  grafana_data:
