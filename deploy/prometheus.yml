global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: convertpdfgo_api
    static_configs:
      - targets:
          - api:8080   # docker-compose service name
    metrics_path: /metrics

  - job_name: convertpdfgo_worker
    # Workers don't expose HTTP yet; left as a placeholder for when we
    # add a /metrics endpoint to cmd/worker/main.go.
    static_configs:
      - targets: []

  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090
